name: CI/CD using CML

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Build Docker Image
        run: docker build -t student-risk-api .

      - name: Run Docker Container
        run: docker run -d --name api -p 8000:8000 student-risk-api

      - name: Test the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health > health.json
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" -d @ci_sample.json > prediction.json
          cat health.json prediction.json

      - name: Show Container Logs
        if: always()
        run: docker logs api

      - name: Generate CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Student Risk Prediction - Rapport CI/CD" > report.md
          echo "## Health check" >> report.md
          echo '```json' >> report.md
          cat health.json >> report.md
          echo '```' >> report.md
          echo "## Prediction de test" >> report.md
          echo '```json' >> report.md
          cat prediction.json >> report.md
          echo '```' >> report.md
          cml comment create report.md